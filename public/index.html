<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <title>YReccomend</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  
  <link rel="stylesheet" href="css/style.css">
  
  <script defer src="https://d3js.org/d3.v7.min.js"></script>
  <script defer src="js/app.js"></script>
</head>
<body>
  <header style="position: absolute; top: 0; left: 0; width: 100%; z-index: 10; padding: 20px; box-sizing: border-box; display: flex; justify-content: space-between; align-items: center; pointer-events: none;">
    <h1 style="margin: 0; color: #f8fafc; font-size: 1.5rem; text-shadow: 0 2px 4px rgba(0,0,0,0.5);">🎯 YReccomend</h1>
    
    <div class="controls" style="pointer-events: auto; background: rgba(30, 41, 59, 0.8); padding: 10px 20px; border-radius: 8px; backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.1); display: flex; gap: 15px; align-items: center; color: white;">
      <label style="font-size: 0.9rem;">Utente: <input id="userId" type="number" min="1" value="1" style="width: 50px; background: rgba(0,0,0,0.3); border: 1px solid #475569; color: white; border-radius: 4px; padding: 2px;"/></label>
      <label style="font-size: 0.9rem;">Top-K: <input id="topK" type="range" min="5" max="50" value="20" style="vertical-align: middle;" /> <span id="topKVal" style="width: 20px; display: inline-block;">20</span></label>
      <button id="reload" style="background: #3b82f6; color: white; border: none; padding: 4px 12px; border-radius: 4px; cursor: pointer; font-weight: bold;">Aggiorna</button>
    </div>
  </header>

  <main style="width: 100vw; height: 100vh; overflow: hidden;">
    <div id="chart" style="width: 100%; height: 100%;"></div>
    
    <aside id="infocard" class="hidden"></aside>
  </main>
</body>
</html>
